<!--
  Contenedor principal del menú
  Usa signals en el template:
  - menuOptions(): Accede al valor actual del array de opciones
  - item.route(): Usa el valor de la signal route para tracking
  - item.icon(), item.label(), etc.: Accede a los valores de cada signal
-->
<div id="nav" class="w-full px-2">
  <!--
    @for es la nueva sintaxis de Angular para bucles
    - menuOptions(): Llama a la signal para obtener el array actual
    - track item.route(): Usa el valor de route como key de tracking
  -->
  @for (item of menuOptions(); track item.route()) {
    <!--
      [routerLink]: Directiva para navegación
      item.route(): Obtiene el valor actual de la signal route
    -->
    <a [routerLink]="item.route()"
      routerLinkActive="bg-blue-800"
       class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-blue-300 transition ease-linear duration-150">
      <div>
        <!--
          [class]: Binding de clase usando una signal
          item.icon(): Obtiene el valor actual del icono
        -->
        <i [class]="item.icon()"></i>
      </div>
      <div class="flex flex-col">
        <!--
          Interpolación con signals:
          item.label(): Muestra el valor actual del label
          item.subLabel(): Muestra el valor actual del subLabel
        -->
        <span class="text-lg font-bold leading-5 text-white">{{item.label()}}</span>
        <span class="text-sm text-white/50 hidden md:block">{{item.subLabel()}}</span>
      </div>
    </a>
  }
</div>
